name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages needs a public repository on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json}
      - run: npm ci && npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with: {path: website/dist}
      - id: deployment
        uses: actions/deploy-pages@v5
